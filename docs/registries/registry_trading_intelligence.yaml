rules:
- rule_id: pattern_lifecycle.implementation
  version: 1.0.0
  rule_type: AI4BINANCE_IMPLEMENTATION_RULE
  statement: Keep pattern observation state separate from opportunity eligibility and trade outcome. OpportunityLifecycleLedger
    is append-only and rejects changed content for an existing event ID and backward event time.
  implementation_ref: ai4binance.opportunity_intelligence:OpportunityLifecycleLedger
  source_ids:
  - reference-01
  - reference-02
  - implementation-01
  test_refs:
  - tests/test_opportunity_intelligence.py
  applicability: SPOT and USD_M_FUTURES research context under the named implementation owner.
  tolerance_policy: The referenced implementation and its boundary tests define numerical tolerances;
    source prose does not calibrate them.
  ambiguity: No method-level OOS probability or promotion follows from source agreement. Unimplemented
    variants are excluded.
