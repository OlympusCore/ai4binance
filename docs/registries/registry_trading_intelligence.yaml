- rule_id: elliott_waves.implementation
  version: 1.0.0
  rule_type: AI4BINANCE_IMPLEMENTATION_RULE
  statement: Use the last six alternating confirmed pivots; require strict local impulse ordering, wave-two
    origin preservation, wave-three not shortest and wave-four non-overlap. Return one unresolved observed
    count, without degree or corrective-count claims. Futures source exceptions are not enabled.
  implementation_ref: ai4binance.intelligence.patterns:ElliottWaveHypothesisEngine
  source_ids:
  - reference-04
  - reference-05
  - implementation-04
  test_refs:
  - tests/test_trading_intelligence.py
  - tests/test_advanced_agents.py
  applicability: SPOT and USD_M_FUTURES research context under the named implementation owner.
  tolerance_policy: The referenced implementation and its boundary tests define numerical tolerances;
    source prose does not calibrate them.
  ambiguity: Wave degree and corrective alternatives are unresolved; the stricter local no-overlap rule
    also applies to Futures.
- rule_id: fibonacci.implementation
  version: 1.0.0
  rule_type: AI4BINANCE_IMPLEMENTATION_RULE
  statement: Use the last two confirmed alternating pivots; retracements are 0.382, 0.5 and 0.618; extensions
    are 1.272 and 1.618. The 0.5 midpoint is conventional. Results remain neutral confluence context.
  implementation_ref: ai4binance.intelligence.patterns:FibonacciConfluenceEngine
  source_ids:
  - reference-06
  - implementation-04
  test_refs:
  - tests/test_trading_intelligence.py
  - tests/test_advanced_agents.py
  applicability: SPOT and USD_M_FUTURES research context under the named implementation owner.
  tolerance_policy: The referenced implementation and its boundary tests define numerical tolerances;
    source prose does not calibrate them.
  ambiguity: The 0.5 retracement is a conventional midpoint, not a Fibonacci ratio; anchors must already
    be available.
- rule_id: harmonic_patterns.implementation
  version: 1.0.0
  rule_type: AI4BINANCE_IMPLEMENTATION_RULE
  statement: Use the last five confirmed alternating XABCD pivots. Apply the registered local Gartley
    or Bat ratio subset; a potential reversal zone is not a confirmed entry.
  implementation_ref: ai4binance.intelligence.patterns:HarmonicPatternEngine
  source_ids:
  - reference-07
  - implementation-04
  test_refs:
  - tests/test_trading_intelligence.py
  - tests/test_advanced_agents.py
  applicability: SPOT and USD_M_FUTURES research context under the named implementation owner.
  tolerance_policy: The referenced implementation and its boundary tests define numerical tolerances;
    source prose does not calibrate them.
  ambiguity: Local Gartley and Bat subsets only; Bat B is restricted to 0.382 through 0.5. Potential geometry
    requires subsequent confirmation.
- rule_id: harmonic_patterns.gartley.implementation
  version: 1.0.0
  rule_type: AI4BINANCE_IMPLEMENTATION_RULE
  statement: 'Local Gartley: AB/XA within 0.03 of 0.618, AD/XA within 0.03 of 0.786, CD/BC from 1.13 to
    1.618, AB/CD from 0.8 to 1.2 and BC/AB from 0.382 to 0.886. Preserve strict alternating XABCD geometry.
    Ratios are local acceptance bounds, not universal source rules.'
  implementation_ref: ai4binance.intelligence.patterns:HarmonicPatternEngine
  source_ids:
  - reference-07
  - implementation-04
  test_refs:
