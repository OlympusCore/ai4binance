  reference:
    definition: Versioned observation and opportunity states with chronological, idempotent event history.
    purpose: Separate formation, confirmation and invalidation from opportunity outcomes.
    origin_or_school: AI4Binance lifecycle model
    standardization_status: LOCAL_IMPLEMENTATION
    market_context:
    - SPOT research context
    - USD_M_FUTURES research context
    direction_semantics: State labels do not grant direction or execution authority.
    timeframe_semantics: Closed-bar availability governs observations; event time cannot regress.
    known_failure_modes:
    - Changed content under one event identity
    - Treating formation as trade confirmation
    ambiguity_notes: Expiry and transition rules belong to the local ledger, not external chart textbooks.
    chapter:
      neutral_interpretation: Expiry and transition rules belong to the local ledger, not external chart
        textbooks.
      multi_timeframe_behavior: Closed-bar availability governs observations; event time cannot regress.
      common_misidentifications: Changed content under one event identity; Treating formation as trade
        confirmation
      implementation_notes: 'Owner: ai4binance.opportunity_intelligence / OpportunityLifecycleLedger.
        Lifecycle implementation does not establish per-pattern profitability.'
      research_backtest_notes: Method-level OOS evidence is NOT_VERIFIED. A future evaluation must bind
        this method version, rule set, source snapshot, causal inputs, costs and held-out regimes; reference
        prose is not a validation receipt.
      source_conflicts: Confirmation examples do not specify local pivot tolerances or lifecycle expiration.;
        Directional tendencies are qualitative; symmetric triangles can resolve in either direction.
      canonical_interpretation: State labels do not grant direction or execution authority.
      support_resistance_interaction: Use the identified boundary or neckline and its anchor provenance;
        a generic nearby level cannot silently replace the formation boundary.
      volatility_interaction: Price equality and break tolerances are local parameters. A volatility buffer
        cannot turn an unconfirmed structure into a confirmed pattern.
      derivatives_context: Futures context is a separate freshness-bound input; this OHLCV geometry does
        not infer liquidation or leverage.
      fibonacci_relationships: No Fibonacci ratio is mandatory unless a referenced rule explicitly requires
        it; a shared-swing overlay is dependent evidence.
      bullish_interpretation: An upward confirmed resolution supports a bullish scenario only where the
        specific registered formation allows it.
      bearish_interpretation: A downward confirmed resolution supports a bearish scenario only where the
        specific registered formation allows it.
