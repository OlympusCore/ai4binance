source_reviews:
- source_id: reference-01
  reviewed_at: '2026-09-27T00:05:56Z'
  finding: Reversal geometry requires neckline or intervening-level confirmation. Similar highs alone
    are not a confirmed reversal.
  implementation_consequence: Keep local pivot tolerances explicit; no source-derived success probability.
- source_id: reference-02
  reviewed_at: '2026-09-27T00:05:56Z'
  finding: Triangles, rectangles, flags and pennants describe different consolidation geometries. Symmetric
    triangles have no predetermined breakout side.
  implementation_consequence: Unimplemented variants remain catalog-only; use closed-bar confirmation.
- source_id: reference-03
  reviewed_at: '2026-09-27T00:05:56Z'
  finding: Prior extrema and trend lines are possible support and resistance references, not guaranteed
    reversal levels.
  implementation_consequence: Retain invalidation and opposing structural targets.
- source_id: reference-04
  reviewed_at: '2026-09-27T00:05:56Z'
  finding: Impulse overlap rules distinguish cash markets from rare intraday Futures exceptions; complete
    wave degree requires additional structure.
  implementation_consequence: Keep the stricter local non-overlap rule and unresolved alternatives. Do
    not silently relax Futures validation.
- source_id: reference-05
  reviewed_at: '2026-09-27T00:05:56Z'
  finding: Corrections contain distinct families and combinations; a generic three-wave proxy cannot establish
    the full taxonomy.
  implementation_consequence: Corrective variants remain catalog-only until individually implemented and
    tested.
- source_id: reference-08
  reviewed_at: '2026-09-27T00:05:56Z'
  finding: Bat B retracement is below 0.618 with preferred 0.382/0.5 values; terminal XA retracement and
    BC extension define the potential reversal zone.
  implementation_consequence: The local B interval is deliberately narrower. Record local tolerances separately;
    a potential reversal is not a trade confirmation.
- source_id: reference-09
  reviewed_at: '2026-09-27T00:05:56Z'
  finding: The 50 percent midpoint is conventionally displayed alongside Fibonacci levels but is not a
    Fibonacci ratio.
  implementation_consequence: Label the midpoint as conventional and preserve confirmed-anchor causality.
- source_id: reference-06
  reviewed_at: '2026-09-27T00:18:58Z'
  finding: Retracements use prior extrema, while extensions project distances beyond a move. The midpoint
    is conventional rather than a Fibonacci sequence ratio.
  implementation_consequence: Keep the local confirmed-anchor ratios explicit. Do not import all illustrative
    source ratios or convert levels into calibrated targets.
- source_id: reference-07
  reviewed_at: '2026-09-27T00:18:58Z'
  finding: The family index distinguishes several named harmonic geometries and points to separate pattern
    definitions.
  implementation_consequence: A family index is not proof that every variant is implemented. Preserve
    individual catalog-only entries and pattern-specific source bindings.
- source_id: reference-10
  reviewed_at: '2026-09-27T03:13:46Z'
  finding: Candles summarize period OHLC using bodies and wicks; time and trade-count sampling answer different questions.
  implementation_consequence: Separate geometric descriptions from reversal context and keep native timeframe provenance.
- source_id: reference-11
  reviewed_at: '2026-09-27T03:13:46Z'
  finding: TA-Lib matches opposite-color bodies and distinguishes strict engulfing from one matching endpoint; preceding trend is not checked.
  implementation_consequence: Document local inclusive endpoint matching separately; neither match integers nor local scores are probabilities.
- source_id: reference-12
  reviewed_at: '2026-09-27T03:13:46Z'
  finding: TA-Lib hammer geometry uses configurable relative candle settings and proximity to the prior low.
  implementation_consequence: Use this as a comparison only; the local rejection label does not claim a complete hammer detector.
- source_id: reference-13
  reviewed_at: '2026-09-27T03:13:46Z'
  finding: Wyckoff separates events, phases and Point-and-Figure counts; spring and UTAD are optional schematic elements.
  implementation_consequence: Retain the local high-volume sweep proxy label; do not infer full phases or institutional intent from one event.
- source_id: reference-14
  reviewed_at: '2026-09-27T03:13:46Z'
  finding: Dow interpretations distinguish primary and secondary moves with cross-average confirmation and differing duration conventions.
  implementation_consequence: Retain catalog status; author thresholds and equity-average relationships do not establish Binance calibration.
- source_id: reference-15
  reviewed_at: '2026-09-27T03:13:46Z'
  finding: Transformed chart values differ from market prices; lower-timeframe construction approximates tick-derived bars.
