entries:
  - entrypoint_id: repository_artifact_update
    scope_family: repository_artifact_mutation
    object_type: REPOSITORY_ARTIFACT
    action: UPDATE
    integration_surface: repository_validation
    current_enforcer: repository_validator
    coverage_state: ROUTED
    status_rationale: Repository artifact updates are already validated through the repository validator before governed evidence is accepted.
    authority_source: docs/standards/standard_repository_file_governance.md
    policy_source: policies/repository-validator/manifest-policy.json
    blocker_source: config/governance/blocker_registry.yaml
    tests:
      - tests/test_repository_validator.py
      - tests/test_artifact_hygiene_scripts.py
    bypass_possible: false
    consequential: true
  - entrypoint_id: policy_document_update
    scope_family: governance_changes
    object_type: POLICY
    action: UPDATE
    integration_surface: policy_as_code
    current_enforcer: DeterministicEnforcementEngine+PolicyAsCodeEngine
    coverage_state: ROUTED
    status_rationale: Governed policy mutations already have a canonical universal enforcement envelope and policy engine path.
    authority_source: docs/standards/standard_governed_object_enforcement.md
    policy_source: src/ai4binance/governance/policy_as_code.py
    blocker_source: config/governance/blocker_registry.yaml
    tests:
      - tests/test_governed_object_enforcement.py
      - tests/test_governance_gate.py
    bypass_possible: false
    consequential: true
  - entrypoint_id: tool_permission_grant
    scope_family: provider_tool_side_effects
    object_type: TOOL_CONTRACT
    action: GRANT_PERMISSION
    integration_surface: mcp_tool_gateway
    current_enforcer: DeterministicEnforcementEngine+ToolPolicyEngine+ToolGateway
    coverage_state: ROUTED
    status_rationale: Tool permission grants already route through the shared tool policy and gateway chain.
    authority_source: docs/standards/standard_governed_object_enforcement.md
    policy_source: src/ai4binance/governance/tool_policy.py
    blocker_source: config/governance/blocker_registry.yaml
    tests:
      - tests/test_governed_object_enforcement.py
      - tests/test_governed_extensions.py
    bypass_possible: false
    consequential: true
  - entrypoint_id: execution_profile_evaluate
    scope_family: execution_boundary_evaluation
    object_type: EXECUTION_PROFILE
    action: EXECUTE
    integration_surface: execution_authority
    current_enforcer: DeterministicEnforcementEngine+ExecutionAuthorityProfile
    coverage_state: ROUTED
    status_rationale: Execution profile evaluation already reuses the canonical execution authority boundary through the universal contract.
    authority_source: docs/standards/standard_governed_object_enforcement.md
    policy_source: src/ai4binance/governance/execution_authority.py
    blocker_source: config/governance/blocker_registry.yaml
    tests:
      - tests/test_governed_object_enforcement.py
      - tests/test_virtual_market_acceptance.py
    bypass_possible: false
    consequential: true
  - entrypoint_id: strategy_definition_profile_contract
    scope_family: strategy_promotion
    object_type: STRATEGY_DEFINITION
    action: PROMOTE
    integration_surface: enforcement_profile_contract
    current_enforcer: DeterministicEnforcementEngine
    coverage_state: ROUTED
    status_rationale: The strategy promotion object family has a routed universal enforcement profile at the contract layer.
    authority_source: docs/standards/standard_governed_object_enforcement.md
    policy_source: config/governance/enforcement_profiles.yaml
    blocker_source: config/governance/blocker_registry.yaml
    tests:
      - tests/test_governed_object_enforcement.py
      - tests/test_stage_governance.py
    bypass_possible: false
    consequential: true
  - entrypoint_id: tuning_strategy_promotion_board
    scope_family: strategy_promotion
    object_type: STRATEGY_DEFINITION
    action: PROMOTE
    integration_surface: tuning_promotion_board
    current_enforcer: PromotionBoard+PlaybookRegistry
    coverage_state: BLOCKED
    status_rationale: Strategy promotion board workflows remain non-authoritative outside the canonical strategy-definition enforcement contract; standalone board promotion cannot widen execution or live authority.
    authority_source: docs/standards/standard_governed_object_enforcement.md
    policy_source: src/ai4binance/tuning/promotion.py
    blocker_source: config/governance/blocker_registry.yaml
    tests:
      - tests/test_tuning_governance.py
    bypass_possible: false
    consequential: true
  - entrypoint_id: governed_parameter_activation
    scope_family: parameter_promotion
    object_type: PARAMETER_SET
    action: CHANGE_PARAMETER
    integration_surface: governed_parameter_store
    current_enforcer: GovernedParameterStore
    coverage_state: BLOCKED
    status_rationale: Direct parameter activation remains approval-bound and paper-only; standalone store writes are not an authorized universal promotion route.
