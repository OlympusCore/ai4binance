version: 1.1.0
profiles:
  - &generic_registry
    profile_id: enforcement-repository-artifact
    profile_version: 1.0.0
    object_type: REPOSITORY_ARTIFACT
    allowed_actions: [READ, UPDATE, SUPERSEDE, QUARANTINE]
    required_gates: [IDENTITY, SCHEMA, AUTHORITY, LIFECYCLE, LINEAGE, BLOCKER, AUDIT]
    required_evidence: []
    required_authorities: [repository_governance]
    allowed_lifecycle_transitions:
      ACTIVE: [SUPERSEDED, ARCHIVED, QUARANTINED]
      DRAFT: [ACTIVE, QUARANTINED]
    side_effect_class: LOCAL_METADATA
    human_approval_class: GOVERNED_CHANGE
  - &authoritative_doc
    profile_id: enforcement-authoritative-document
    profile_version: 1.0.0
    object_type: POLICY
    allowed_actions: [READ, UPDATE, ACTIVATE, SUPERSEDE]
    required_gates: [IDENTITY, SCHEMA, AUTHORITY, LIFECYCLE, POLICY, EVIDENCE, LINEAGE, BLOCKER, AUDIT]
    required_evidence: [quality_gate_evidence]
    required_authorities: [enterprise_governance]
    allowed_lifecycle_transitions:
      DRAFT: [ACTIVE, REJECTED]
      ACTIVE: [SUPERSEDED, DEPRECATED, ARCHIVED]
    action_transition_rules:
      ACTIVATE:
        transition_required: true
        allowed_from: [DRAFT]
        allowed_to: [ACTIVE]
      SUPERSEDE:
        transition_required: true
        allowed_from: [ACTIVE]
        allowed_to: [SUPERSEDED]
    side_effect_class: GOVERNANCE
    human_approval_class: GOVERNED_CHANGE
  - <<: *authoritative_doc
    profile_id: enforcement-constraint
    object_type: CONSTRAINT
  - <<: *authoritative_doc
    profile_id: enforcement-decision-rule
    object_type: DECISION_RULE
  - <<: *authoritative_doc
