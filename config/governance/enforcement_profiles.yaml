  - &strategy_family
    profile_id: enforcement-strategy-family
    profile_version: 1.0.0
    object_type: STRATEGY_DEFINITION
    allowed_actions: [READ, UPDATE, ACTIVATE, PROMOTE, SUPERSEDE]
    required_gates: [IDENTITY, SCHEMA, AUTHORITY, LIFECYCLE, POLICY, EVIDENCE, LINEAGE, BLOCKER, EXECUTION, AUDIT]
    required_evidence: [oos_validation, walk_forward_validation, paper_readiness]
    required_authorities: [strategy_governance]
    allowed_lifecycle_transitions:
      DRAFT: [BACKTESTED, REJECTED]
      BACKTESTED: [WALK_FORWARD_VALIDATED, REJECTED]
      WALK_FORWARD_VALIDATED: [OOS_VALIDATED, REJECTED]
      OOS_VALIDATED: [PAPER_APPROVED, REJECTED]
      PAPER_APPROVED: [ACTIVE, DEPRECATED]
      ACTIVE: [SUPERSEDED, DEPRECATED, ARCHIVED]
    action_transition_rules:
      ACTIVATE:
        transition_required: true
        allowed_from: [PAPER_APPROVED]
        allowed_to: [ACTIVE]
      PROMOTE:
        transition_required: true
        allowed_from: [OOS_VALIDATED]
        allowed_to: [PAPER_APPROVED]
      SUPERSEDE:
        transition_required: true
        allowed_from: [ACTIVE]
        allowed_to: [SUPERSEDED]
    side_effect_class: STRATEGY_MUTATION
    human_approval_class: CONSEQUENTIAL_PROMOTION
  - <<: *strategy_family
    profile_id: enforcement-setup-definition
    object_type: SETUP_DEFINITION
  - <<: *strategy_family
