      objective: "Validate registered component ownership, dependency direction, deterministic boundaries, and authority ceilings."
      standard_mapping_names: ["critical_architecture_conformance"]
      required_paths:
        - "docs/registries/registry_logical_architecture.yaml"
        - "src/ai4binance/governance/architecture/loader.py"
      required_tests:
        - "tests/governance/architecture/test_logical_architecture_registry.py"
    guardrail:
      objective: "Validate hard blockers, veto paths, enforcement coverage, and fail-closed bypass resistance."
      standard_mapping_names: ["critical_enforcement_inventory"]
      required_paths:
        - "config/governance/enforcement_inventory.yaml"
        - "config/governance/enforcement_profiles.yaml"
      required_tests:
        - "tests/test_governed_object_enforcement.py"
        - "tests/test_governance_gate.py"
    eval:
      objective: "Validate deterministic process evaluation and measured performance regression decisions."
      standard_mapping_names: ["lean_process", "six_sigma_performance"]
      required_paths:
        - "src/ai4binance/governance/lean.py"
        - "src/ai4binance/ops/performance.py"
      required_tests:
        - "tests/test_lean_governance.py"
        - "tests/test_performance_guard.py"
    assurance:
      objective: "Validate snapshot-bound evidence, requirement traceability, technical truth, policy eligibility, and human authority separation."
      standard_mapping_names: ["critical_enforcement_inventory"]
      required_paths:
        - "config/governance/enforcement_inventory.yaml"
        - "config/quality/gates.yaml"
      required_tests:
        - "tests/test_requirement_assurance_chain.py"

