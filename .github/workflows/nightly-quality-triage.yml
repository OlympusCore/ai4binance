name: Nightly Quality Triage

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install locked project range
        run: python -m pip install -e ".[dev]"

      - name: Run bounded report-only triage
        run: >-
          python -m ai4binance.ops.quality_triage
          --repository-root .
          --output-directory Artifacts/quality-triage
          --revision ${{ github.sha }}
          --command-timeout-seconds 600

      - name: Upload triage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-quality-triage-${{ github.run_id }}
          path: Artifacts/quality-triage/
          if-no-files-found: error
          retention-days: 30
