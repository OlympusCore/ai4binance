name: Nightly Quality Triage

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install canonical Python
        run: uv python install 3.14.7

      - name: Sync locked development environment
        run: uv sync --frozen --extra dev

      - name: Run bounded report-only triage
        run: >-
          uv run --frozen python -m ai4binance.ops.quality_triage
          --repository-root .
          --output-directory runtime/artifacts/quality/triage
          --revision ${{ github.sha }}
          --command-timeout-seconds 600

      - name: Upload triage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-quality-triage-${{ github.run_id }}
          path: runtime/artifacts/quality/triage/
          if-no-files-found: error
          retention-days: 30

