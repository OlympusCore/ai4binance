name: Nightly Quality Triage

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install canonical Python
        run: uv python install 3.14.7

      - name: Sync locked development environment
        run: uv sync --frozen --extra dev

      - name: Run bounded report-only triage
        run: >-
          uv run --frozen python -m ai4binance.ops.quality_triage
          --repository-root .
          --output-directory runtime/artifacts/quality/triage
          --revision ${{ github.sha }}
          --command-timeout-seconds 600

      - name: Upload triage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-quality-triage-${{ github.run_id }}
          path: runtime/artifacts/quality/triage/
          if-no-files-found: error
          retention-days: 30

