name: Quality Profiles

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      profile:
        description: Quality profile for a manual run
        required: true
        default: standard
        type: choice
        options:
          - standard
          - full

permissions:
  contents: read

concurrency:
  group: quality-profiles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install canonical Python
        shell: pwsh
        run: uv python install 3.14.7

      - name: Sync locked development environment
        shell: pwsh
        run: uv sync --frozen --extra dev

      - name: Run standard profile for pull requests
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: .\scripts\quality.ps1 -Profile standard

      - name: Run full profile for published releases
        if: github.event_name == 'release'
        shell: pwsh
        run: .\scripts\quality.ps1 -Profile full

      - name: Run selected profile for manual milestone verification
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: .\scripts\quality.ps1 -Profile "${{ inputs.profile }}"

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-profile-${{ github.run_id }}
          path: |
            runtime/quality/
            runtime/artifacts/quality/gate/
          if-no-files-found: warn
          retention-days: 30
